<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Urna</title>
    <link rel="stylesheet" href="./style.css">
    <script>
        // Guarda: sem login, vai para o login e volta para cá depois
        if (!localStorage.getItem("token")) {
            localStorage.setItem("destino", "admin.html");
            window.location.replace("./login.html");
        }
    </script>
</head>
<body>
    <header>
        <h1>Admin - Candidatos</h1>
        <nav>
            <a href="./index.html"><button class="aba" type="button">Voltar para a urna</button></a>
            <button class="aba" type="button" id="btnSair">Sair</button>
        </nav>
    </header>

    <main>
        <section class="tela ativa">
            <h2>Cadastrar Candidatos</h2>
            <form id="formCandidato">
                <input type="text" id="nomeCandidato" placeholder="Nome do aluno" required>
                <input type="text" id="numeroCandidato" placeholder="NÚMERO (ex: 10)" maxlength="2" inputmode="numeric" required>
                <button type="submit">Adicionar</button>
            </form>

            <h2>Candidatos cadastrados</h2>
            <ul id="listaCandidatos"></ul>
        </section>
    </main>

    <script src="./JS/admin.js"></script>
</body>
</html>
